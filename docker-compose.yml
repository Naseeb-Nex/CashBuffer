services:
  # 0. PostgreSQL Database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cashbuffer}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cashbuffer}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 200M

  # 1. Native Migrations Service (Runs on startup)
  migration:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "scripts/migrate.py"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-cashbuffer}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # 2. Core API (FastAPI)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-cashbuffer}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LOCAL_JWT_SECRET: ${LOCAL_JWT_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KINDE_DOMAIN: ${KINDE_DOMAIN:-}
      KINDE_CLIENT_ID: ${KINDE_CLIENT_ID:-}
      KINDE_CLIENT_SECRET: ${KINDE_CLIENT_SECRET:-}
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 200M

  # 3. Ingress Microservice (Worker)
  ingress:
    build:
      context: .
      dockerfile: apps/ingress/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-cashbuffer}
      GMAIL_TOKEN_PATH: /app/secrets/token.json
      GMAIL_CREDENTIALS_PATH: /app/secrets/credentials.json
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 150M

  # 4. FastMCP Server (AI Financial Intelligence)
  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-cashbuffer}
      JWT_SECRET: ${LOCAL_JWT_SECRET:-}
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 150M

  # 5. Frontend Dashboard (Next.js)
  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 200M

volumes:
  pgdata:
